<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Conteúdos — Albertina Silva AST</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-dark: #9A7A2E;
    --cream: #FAF6EF;
    --beige: #F0E8D8;
    --brown-dark: #2C1A0E;
    --brown-mid: #5C3D2E;
    --brown-light: #A07850;
    --white: #FFFFFF;
    --shadow: rgba(44, 26, 14, 0.12);
    --shadow-deep: rgba(44, 26, 14, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--brown-dark);
    min-height: 100vh;
  }

  /* ---- HEADER ---- */
  header {
    background: linear-gradient(135deg, var(--brown-dark) 0%, var(--brown-mid) 60%, #3D2010 100%);
    padding: 32px 24px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A84C' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 1;
  }
  .header-inner {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .logo-wrap {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 6px rgba(201,168,76,0.18), 0 8px 32px var(--shadow-deep);
    overflow: hidden;
    background: var(--beige);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .logo-wrap img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .logo-placeholder {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 2px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--white);
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  header h1 span { color: var(--gold-light); }
  header p.subtitle {
    font-size: 0.88rem;
    color: var(--gold-light);
    font-weight: 300;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .gold-divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 2px auto;
  }

  /* ---- SEARCH ---- */
  .search-wrap {
    background: var(--beige);
    border-bottom: 1px solid var(--gold-light);
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow);
  }
  .search-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .search-box {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--white);
    border: 1.5px solid var(--gold-light);
    border-radius: 40px;
    padding: 10px 18px;
    gap: 10px;
    box-shadow: 0 2px 8px var(--shadow);
    transition: border-color 0.2s;
  }
  .search-box:focus-within { border-color: var(--gold); }
  .search-box svg { color: var(--gold); flex-shrink: 0; }
  .search-box input {
    border: none; outline: none;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    color: var(--brown-dark);
    width: 100%;
    background: transparent;
  }
  .search-box input::placeholder { color: var(--brown-light); }
  #clearSearch {
    background: none; border: none; cursor: pointer;
    color: var(--brown-light); font-size: 1.1rem; padding: 0 4px;
    display: none;
  }
  #clearSearch.visible { display: block; }

  /* ---- LAYOUT ---- */
  .main-layout {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 0;
    min-height: calc(100vh - 200px);
  }

  /* ---- SIDEBAR ---- */
  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--gold-light);
    padding: 28px 0 40px;
    position: sticky;
    top: 69px;
    height: calc(100vh - 69px);
    overflow-y: auto;
  }
  .sidebar h3 {
    font-family: 'Playfair Display', serif;
    font-size: 0.78rem;
    color: var(--gold-dark);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    padding: 0 22px 14px;
    border-bottom: 1px solid var(--beige);
    margin-bottom: 8px;
  }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 22px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    font-family: 'Lato', sans-serif;
    font-size: 0.87rem;
    color: var(--brown-mid);
    transition: all 0.18s;
    border-left: 3px solid transparent;
    position: relative;
  }
  .cat-btn .cat-icon { font-size: 1.1rem; width: 22px; text-align: center; }
  .cat-btn .cat-name { flex: 1; font-weight: 400; }
  .cat-btn .cat-count {
    background: var(--beige);
    color: var(--brown-light);
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 20px;
    padding: 1px 7px;
    min-width: 22px;
    text-align: center;
  }
  .cat-btn:hover { background: var(--beige); color: var(--brown-dark); }
  .cat-btn.active {
    background: linear-gradient(90deg, rgba(201,168,76,0.12), transparent);
    color: var(--brown-dark);
    border-left-color: var(--gold);
    font-weight: 700;
  }
  .cat-btn.active .cat-count { background: var(--gold-light); color: var(--gold-dark); }

  /* ---- CONTENT ---- */
  .content-area {
    padding: 32px 28px 60px;
    background: var(--cream);
  }
  .section-header {
    margin-bottom: 24px;
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
  }
  .section-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: var(--brown-dark);
    font-weight: 700;
  }
  .section-header .section-icon { font-size: 1.6rem; }
  .section-count {
    font-size: 0.8rem;
    color: var(--brown-light);
    background: var(--beige);
    border: 1px solid var(--gold-light);
    border-radius: 20px;
    padding: 3px 12px;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .section-desc {
    font-size: 0.88rem;
    color: var(--brown-light);
    font-style: italic;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--gold-light);
  }

  /* ---- CARDS ---- */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 10px var(--shadow);
    transition: all 0.22s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card:hover {
    box-shadow: 0 6px 24px var(--shadow-deep);
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  .card-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold-dark);
    background: var(--beige);
    border-radius: 20px;
    padding: 3px 10px;
    align-self: flex-start;
  }
  .card-text {
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--brown-dark);
    flex: 1;
    white-space: pre-wrap;
  }
  .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .platform-badges { display: flex; gap: 6px; }
  .badge {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .badge.fb { background: #E8F0FE; color: #1A5FFF; }
  .badge.wa { background: #E7F9F0; color: #128C3E; }
  .copy-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Lato', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(154,122,46,0.3);
  }
  .copy-btn:hover {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    transform: scale(1.03);
    box-shadow: 0 4px 14px rgba(154,122,46,0.4);
  }
  .copy-btn.copied {
    background: linear-gradient(135deg, #2E7D32, #4CAF50);
    box-shadow: 0 2px 8px rgba(46,125,50,0.3);
  }

  /* ---- SEARCH RESULTS ---- */
  .search-results-header {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--brown-mid);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--gold-light);
  }
  .search-results-header span { color: var(--gold-dark); }
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--brown-light);
  }
  .no-results .no-icon { font-size: 3rem; margin-bottom: 12px; }
  .no-results p { font-size: 0.95rem; }

  /* ---- CATEGORY SECTION ---- */
  .category-section { margin-bottom: 50px; }

  /* ---- MOBILE ---- */
  .mobile-cat-toggle {
    display: none;
    width: 100%;
    padding: 12px 18px;
    background: var(--white);
    border: 1.5px solid var(--gold-light);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    color: var(--brown-dark);
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-weight: 700;
  }
  .mobile-sidebar {
    display: none;
    background: var(--white);
    border: 1px solid var(--gold-light);
    border-radius: 10px;
    margin-bottom: 24px;
    padding: 10px 0;
    box-shadow: 0 4px 16px var(--shadow);
  }
  .mobile-sidebar.open { display: block; }

  @media (max-width: 768px) {
    .main-layout { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .mobile-cat-toggle { display: flex; }
    .content-area { padding: 20px 16px 40px; }
    .cards-grid { grid-template-columns: 1fr; }
    .search-wrap { padding: 14px 16px; }
    header { padding: 24px 16px 22px; }
    .logo-wrap { width: 72px; height: 72px; }
  }

  /* ---- FOOTER ---- */
  footer {
    background: var(--brown-dark);
    color: var(--gold-light);
    text-align: center;
    padding: 20px;
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }
  footer span { color: var(--gold); }

  /* ---- SCROLLBAR ---- */
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--gold-light); border-radius: 10px; }

  /* ---- TOAST ---- */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--brown-dark);
    color: var(--gold-light);
    border: 1px solid var(--gold);
    padding: 12px 24px;
    border-radius: 40px;
    font-size: 0.88rem;
    z-index: 9999;
    transition: transform 0.3s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

// Active category
let activeCategory = 'all';
let searchQuery = '';

function buildSidebar(container) {
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn' + (activeCategory === 'all' ? ' active' : '');
  allBtn.innerHTML = `<span class="cat-icon">✨</span><span class="cat-name">Todas as respostas</span><span class="cat-count">${data.reduce((a,c)=>a+c.responses.length,0)}</span>`;
  allBtn.onclick = () => { setCategory('all'); if(container.classList.contains('mobile-sidebar')) toggleMobileSidebar(); };
  container.appendChild(allBtn);

  data.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (activeCategory === cat.id ? ' active' : '');
    btn.innerHTML = `<span class="cat-icon">${cat.icon}</span><span class="cat-name">${cat.name}</span><span class="cat-count">${cat.responses.length}</span>`;
    btn.onclick = () => { setCategory(cat.id); if(container.classList.contains('mobile-sidebar')) toggleMobileSidebar(); };
    container.appendChild(btn);
  });
}

function setCategory(id) {
  activeCategory = id;
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').classList.remove('visible');
  renderContent();
  updateSidebarActive();
}

function updateSidebarActive() {
  document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
  // Re-render sidebars
  document.getElementById('sidebarCats').innerHTML = '';
  document.getElementById('mobileSidebar').innerHTML = '';
  buildSidebar(document.getElementById('sidebarCats'));
  buildSidebar(document.getElementById('mobileSidebar'));
}

function renderContent() {
  const area = document.getElementById('contentArea');
  area.innerHTML = '';

  if (searchQuery.trim()) {
    renderSearch(area);
    return;
  }

  const cats = activeCategory === 'all' ? data : data.filter(c => c.id === activeCategory);

  cats.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category-section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <span class="section-icon">${cat.icon}</span>
      <h2>${cat.name}</h2>
      <span class="section-count">${cat.responses.length} respostas</span>
    `;
    section.appendChild(header);

    const desc = document.createElement('p');
    desc.className = 'section-desc';
    desc.textContent = cat.desc;
    section.appendChild(desc);

    const grid = document.createElement('div');
    grid.className = 'cards-grid';

    cat.responses.forEach((resp, i) => {
      grid.appendChild(buildCard(resp, cat.platform));
    });

    section.appendChild(grid);
    area.appendChild(section);
  });
}

function renderSearch(area) {
  const q = searchQuery.toLowerCase();
  const results = [];

  data.forEach(cat => {
    cat.responses.forEach(resp => {
      if (resp.text.toLowerCase().includes(q) || resp.tag.toLowerCase().includes(q) || cat.name.toLowerCase().includes(q)) {
        results.push({ resp, cat });
      }
    });
  });

  const header = document.createElement('p');
  header.className = 'search-results-header';
  header.innerHTML = results.length > 0
    ? `<span>${results.length}</span> resultado${results.length !== 1 ? 's' : ''} encontrado${results.length !== 1 ? 's' : ''} para "<span>${escapeHtml(searchQuery)}</span>"`
    : `Nenhum resultado para "<span>${escapeHtml(searchQuery)}</span>"`;
  area.appendChild(header);

  if (results.length === 0) {
    const noRes = document.createElement('div');
    noRes.className = 'no-results';
    noRes.innerHTML = `<div class="no-icon">🔍</div><p>Tente outras palavras-chave como "preço", "entrega", "tamanho"...</p>`;
    area.appendChild(noRes);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'cards-grid';
  results.forEach(({ resp, cat }) => {
    grid.appendChild(buildCard(resp, cat.platform));
  });
  area.appendChild(grid);
}

function buildCard(resp, platforms) {
  const card = document.createElement('div');
  card.className = 'card';

  const tag = document.createElement('span');
  tag.className = 'card-tag';
  tag.textContent = resp.tag;

  const text = document.createElement('p');
  text.className = 'card-text';
  text.textContent = resp.text;

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const badges = document.createElement('div');
  badges.className = 'platform-badges';
  platforms.forEach(p => {
    const b = document.createElement('span');
    b.className = `badge ${p}`;
    b.textContent = p === 'fb' ? 'Facebook' : 'WhatsApp';
    badges.appendChild(b);
  });

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar`;
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(resp.text).then(() => {
      copyBtn.classList.add('copied');
      copyBtn.innerHTML = `✓ Copiado!`;
      showToast();
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar`;
      }, 2000);
    });
  };

  actions.appendChild(badges);
  actions.appendChild(copyBtn);

  card.appendChild(tag);
  card.appendChild(text);
  card.appendChild(actions);
  return card;
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').classList.remove('visible');
  searchQuery = '';
  renderContent();
}

function toggleMobileSidebar() {
  const ms = document.getElementById('mobileSidebar');
  const arrow = document.getElementById('mobileArrow');
  ms.classList.toggle('open');
  arrow.textContent = ms.classList.contains('open') ? '▲' : '▼';
}

// Init
document.getElementById('sidebarCats').innerHTML = '';
document.getElementById('mobileSidebar').innerHTML = '';
buildSidebar(document.getElementById('sidebarCats'));
buildSidebar(document.getElementById('mobileSidebar'));
renderContent();

// Search
document.getElementById('searchInput').addEventListener('input', function() {
  searchQuery = this.value;
  document.getElementById('clearSearch').classList.toggle('visible', searchQuery.length > 0);
  renderContent();
});
</script>
